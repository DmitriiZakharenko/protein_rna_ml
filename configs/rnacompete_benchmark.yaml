# RNAcompete Benchmark Configuration
# Decision: Option B — independent benchmark (NOT merged into training)
# See scripts/17_prepare_rnacompete_benchmark.py for full rationale
#
# Run benchmark evaluation:
#   python scripts/17_prepare_rnacompete_benchmark.py \
#       --rnacompete_dir /path/to/rnacompete_analysis \
#       --output_dir data/benchmarks/rnacompete

benchmark:
  name: rnacompete_zeroshot
  description: >
    Zero-shot generalization benchmark across 1,087 RBPs (26 organisms).
    Models trained on HTR-SELEX + RBNS evaluated on RNAcompete without
    any fine-tuning. Directly comparable to ZHMolGraph hard split.
  integration_strategy: benchmark_only   # NOT train — see rationale below

  # Rationale for benchmark_only:
  #   1. Protein sequences are construct sequences (RBDs, ~258 aa median)
  #      vs full-length proteins used in HTR-SELEX/RBNS (~400-800 aa)
  #   2. RNA probes are short (35-41 nt) synthetic oligomers
  #   3. 26 eukaryotic organisms; merging contaminates protein-aware splits
  #   4. Zero-shot evaluation measures motif generalization, not memorization

data:
  # Generated by scripts/17_prepare_rnacompete_benchmark.py
  all:          data/benchmarks/rnacompete/rnacompete_all.tsv
  human_only:   data/benchmarks/rnacompete/rnacompete_human.tsv
  non_human:    data/benchmarks/rnacompete/rnacompete_nonhuman.tsv
  rbpzoo:       data/benchmarks/rnacompete/rnacompete_rbpzoo.tsv
  summary_json: data/benchmarks/rnacompete/benchmark_summary.json

evaluation:
  primary_metric: per_protein_auroc_median
  report_metrics:
    - per_protein_auroc_median
    - per_protein_auroc_min
    - auroc_overall
    - auprc_overall
  stratify_by:
    - organism
    - dataset_source    # rbpzoo / eukarya / ucrbp
    - human_vs_nonhuman

  # Minimum per-protein sample requirements for valid AUROC
  min_pos_per_protein: 10
  min_neg_per_protein: 10

  # Comparison baseline
  zhmolgraph_auroc: 0.798
  zhmolgraph_auprc: 0.820

sequence_encoding:
  rna_max_len:  41    # all probes are 35-41 nt; no truncation needed
  prot_max_len: 700   # covers 95%+ of construct sequences (max 631 aa)
  rna_encoding: one_hot
  prot_encoding: one_hot  # or esm2 for ESM-2 variants

# Datasets to prepare in parallel (outside RNAcompete)
future_datasets:
  immediate:
    - name: iCLIP_TDP43
      source: ENCODE / GEO
      proteins: [TDP-43]
      assay: iCLIP
      note: in vivo binding, cytoplasmic RNAs
    - name: iCLIP_FUS
      source: ENCODE / GEO
      proteins: [FUS]
      assay: iCLIP
    - name: PAR_CLIP_AGO2
      source: GEO GSE21918
      proteins: [AGO2]
      assay: PAR-CLIP
      note: miRNA-loaded RISC; captures seed-pairing logic
    - name: eCLIP_expanded
      source: ENCODE portal
      proteins: [expand from 9 to 20+]
      assay: eCLIP
      note: GC/length-matched genomic negatives

  medium_priority:
    - name: RNA_structure_features
      source: ViennaRNA / RNAfold
      type: derived_features
      note: MFE, base-pair probability, accessibility for training sequences
    - name: MMseqs2_homology_split
      source: derived from training set protein sequences
      type: evaluation_split
      note: 30% identity threshold; quantifies homology leakage in current splits
    - name: RNAInter_expansion
      source: http://www.rnainter.org/
      type: interaction_graph
      note: >
        Contains 60M+ interactions; can supplement with low-confidence
        interactions as hard negatives after homology filtering
